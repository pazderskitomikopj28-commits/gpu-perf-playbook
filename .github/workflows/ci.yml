name: tools-and-portable-backend

on:
  push:
  pull_request:

jobs:
  python-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m py_compile scripts/*.py
      - run: python scripts/roofline.py --flops 2e9 --bytes 8e9 --peak-flops 2e13 --peak-bandwidth 9e11
      - run: python scripts/validate_manifest.py examples/benchmark_manifest.json

  portable-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile the explicit SUPA stub
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -I portable_backend/include
          -c portable_backend/src/supa_backend_stub.cpp
          -o /tmp/supa_backend_stub.o
