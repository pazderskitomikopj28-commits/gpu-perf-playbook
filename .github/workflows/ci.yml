name: tools-and-portable-backend

on:
  push:
  pull_request:

jobs:
  python-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m py_compile scripts/*.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/roofline.py --flops 2e9 --bytes 8e9 --peak-flops 2e13 --peak-bandwidth 9e11
      - run: python scripts/validate_manifest.py examples/benchmark_manifest.json
      - run: python scripts/parse_ncu_csv.py tests/data/ncu_sample.csv --format json
      - run: python scripts/benchmark_stats.py summarize tests/data/benchmark_samples.csv --format json
      - run: python scripts/benchmark_stats.py summarize benchmarks/rtx4060-raw-samples-2026-08-30.csv --format json
      - run: python scripts/benchmark_stats.py compare tests/data/benchmark_samples.csv tests/data/benchmark_samples.csv
      - run: python scripts/capture_environment.py --repository . > environment.json

  portable-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
